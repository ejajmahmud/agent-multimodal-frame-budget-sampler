[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-multimodal-frame-budget-sampler"
version = "0.1.0"
description = "Adaptive video frame subsampler calculating motion entropy to preserve token budgets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-multimodal-frame-budget-sampler = "agent_multimodal_frame_budget_sampler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_multimodal_frame_budget_sampler*"]
